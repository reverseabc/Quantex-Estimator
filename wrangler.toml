
name = "quantex-estimator"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]
main = "worker/index.js"
 
[assets]
directory = "./dist"
not_found_handling = "single-page-application"
binding = "ASSETS"
run_worker_first = ["/api/*"]
 
[[d1_databases]]
binding = "DB"
database_name = "quantex-db"
database_id = "f39a322a-b238-4702-8b00-8c1cdfa6b2ce"

# BL-03: login rate limits (Workers Rate Limiting binding).
# Limits are per Cloudflare location and approximate - fine for throttling guessing.
# namespace_id just needs to be a unique positive integer within the account.
[[ratelimits]]
name = "LOGIN_IP_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 10
  period = 60

[[ratelimits]]
name = "LOGIN_USER_LIMITER"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 5
  period = 60

# ---------------------------------------------------------------------------
# Staging (FN-11): a separate Worker and D1 database for testing migrations and
# builds before they reach live. It never holds live data: seed it with test
# accounts only. Deploy with `npm run deploy:staging`.
#
# Bindings aren't inherited from the top level, so they're repeated here.
# Rate limiter namespace IDs differ from live so the two keep separate counters.
# ---------------------------------------------------------------------------
[env.staging]
name = "quantex-estimator-staging"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "quantex-db-staging"
# Paste the ID printed by `npx wrangler d1 create quantex-db-staging`.
database_id = "757e82ea-2109-49b9-b4b1-b4b5d38bde26"

[[env.staging.ratelimits]]
name = "LOGIN_IP_LIMITER"
namespace_id = "2001"

  [env.staging.ratelimits.simple]
  limit = 10
  period = 60

[[env.staging.ratelimits]]
name = "LOGIN_USER_LIMITER"
namespace_id = "2002"

  [env.staging.ratelimits.simple]
  limit = 5
  period = 60
